<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Peminjaman</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif !important;
      background: linear-gradient(135deg, #ffd1e8 0%, #c2e5ff 100%) !important;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 50px;
    }

    .main-container {
      width: 100%;
      max-width: 1000px;
      padding: 0 20px 40px;
    }

    .glass-box {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      padding: 35px;
      width: 100%;
    }

    .page-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 800;
      color: #ff6fae;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .page-subtitle {
      color: #64748b;
      font-size: 15px;
      margin-top: 8px;
    }

    /* Modern Table Style */
    .table-container {
      overflow-x: auto;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.3);
    }

    .modern-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    .modern-table th {
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.6);
      color: #ff6fae;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid rgba(255, 111, 174, 0.2);
    }

    .modern-table td {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      font-size: 15px;
      color: #1e293b;
      vertical-align: middle;
    }

    .modern-table tbody tr {
      transition: all 0.2s ease;
    }

    .modern-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .book-title-cell {
      font-weight: 600;
      color: #0f172a;
    }

    /* Status Badges */
    .badge {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
      white-space: nowrap;
    }

    .badge-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-borrowed {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge-return-pending {
      background: #e0f2fe;
      color: #075985;
    }

    .badge-returned {
      background: #dcfce7;
      color: #166534;
    }

    .badge-rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .action-row {
      margin-top: 30px;
      display: flex;
      justify-content: center;
    }

    .btn-back-custom {
      background: white;
      color: #ff6fae;
      border: 2px solid #ff6fae;
      padding: 12px 30px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .btn-back-custom:hover {
      background: #ff6fae;
      color: white;
      box-shadow: 0 8px 20px rgba(255, 111, 174, 0.3);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .glass-box {
        padding: 20px;
      }

      .modern-table th,
      .modern-table td {
        padding: 12px 15px;
      }
    }
  </style>
</head>

<body>
  <div class="main-container">
    <div class="glass-box">
      <div class="page-header">
        <h2 class="page-title">Riwayat Peminjaman</h2>
        <p class="page-subtitle">Daftar lengkap transaksi buku Anda di perpustakaan</p>
      </div>

      <div class="table-container">
        <table class="modern-table">
          <thead>
            <tr>
              <th>Judul Buku</th>
              <th>Pinjam</th>
              <th>Kembali</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr>
              <td colspan="4" style="text-align: center; padding: 40px; color: #64748b;">
                Memuat riwayat peminjaman...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="action-row">
        <a href="dashboard.html" class="btn-back-custom">
          <span>←</span> Kembali ke Dashboard
        </a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:8000/api';
    const token = localStorage.getItem('token');
    const currentUser = localStorage.getItem('currentUser');

    if (!token || !currentUser) {
      window.location.href = 'login.html';
    }

    function getBadgeClass(status) {
      switch (status) {
        case 'pending': return 'badge-pending';
        case 'borrowed': return 'badge-borrowed';
        case 'return_pending': return 'badge-return-pending';
        case 'returned': return 'badge-returned';
        case 'rejected': return 'badge-rejected';
        default: return '';
      }
    }

    function statusLabel(status, trx = {}) {
      if (trx.fine_payment_requested_at && !trx.fine_paid_at) return 'Verifikasi Denda';
      switch (status) {
        case 'pending': return 'Menunggu Konfirmasi';
        case 'borrowed': return 'Sedang Dipinjam';
        case 'returned':
        case 'return_pending': return 'Sudah Dikembalikan';
        case 'rejected': return `Ditolak ${trx.rejected_reason ? '(' + trx.rejected_reason + ')' : ''}`;
        default: return status || '-';
      }
    }

    function fmtDate(dt) {
      if (!dt) return '-';
      const date = new Date(dt);
      return date.toLocaleString('id-ID', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function displayReturnOrDue(trx) {
      if (trx.status === 'pending' || trx.status === 'borrowed' || trx.status === 'return_pending') {
        return fmtDate(trx.due_date);
      }
      if (trx.status === 'returned') {
        return fmtDate(trx.return_date);
      }
      return '-';
    }

    const historyBody = document.getElementById('historyBody');

    fetch(`${API_URL}/transactions/my`, {
      headers: {
        Accept: 'application/json',
        Authorization: 'Bearer ' + token,
      },
    })
      .then(async (res) => {
        const data = await res.json();
        return { status: res.status, data };
      })
      .then(({ status, data }) => {
        if (status !== 200) {
          historyBody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 40px; color: #ef4444;">Gagal memuat data: ${data.message || 'Error'}</td></tr>`;
          return;
        }

        const list = data.data || [];
        if (list.length === 0) {
          historyBody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 60px; color: #64748b;">Belum ada riwayat peminjaman 📚</td></tr>`;
          return;
        }

        historyBody.innerHTML = list
          .map(
            (trx) => `
            <tr>
              <td class="book-title-cell">${trx.book?.title || '-'}</td>
              <td>${fmtDate(trx.borrow_date)}</td>
              <td>${displayReturnOrDue(trx)}</td>
              <td>
                <span class="badge ${getBadgeClass(trx.status)}">
                  ${statusLabel(trx.status, trx)}
                </span>
              </td>
            </tr>
          `
          )
          .join('');
      })
      .catch((err) => {
        console.error(err);
        historyBody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 40px; color: #ef4444;">Tidak bisa terhubung ke server.</td></tr>`;
      });
  </script>
</body>

</html>
