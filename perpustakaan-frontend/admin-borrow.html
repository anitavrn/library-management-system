<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konfirmasi Peminjaman (Safe App)</title>

  <!-- CSS Reset & Style Sederhana tapi Bagus -->
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* Tambahan Style Spesifik Halaman Ini */
    .container {
      max-width: 1100px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 20px;
    }

    h1 {
      color: #d63384;
      margin: 0;
    }

    .btn-back {
      text-decoration: none;
      color: #666;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-back:hover {
      color: #d63384;
    }

    /* Table Styles */
    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }

    th {
      background: #ffe6f2;
      color: #d63384;
      padding: 12px;
      text-align: left;
      border-radius: 4px 4px 0 0;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }

    /* Badges */
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: bold;
    }

    .bg-pending {
      background: #fff3cd;
      color: #856404;
    }

    .bg-borrowed {
      background: #d1e7dd;
      color: #0f5132;
    }

    .bg-rejected {
      background: #f8d7da;
      color: #842029;
    }

    .bg-returned {
      background: #d4edda;
      color: #155724;
    }

    /* Buttons */
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-approve {
      background: #198754;
      color: white;
    }

    .btn-reject {
      background: #dc3545;
      color: white;
    }

    .btn-group {
      display: flex;
      gap: 5px;
    }

    .error-box {
      background: #f8d7da;
      color: #842029;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      display: none;
      margin-top: 20px;
    }

    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
      padding: 20px;
    }
  </style>
</head>

<body>

  <!-- ERROR OVERLAY (Aman dari Loop) -->
  <div id="authError" class="container" style="display: none; text-align: center;">
    <h2 style="color: #dc3545;">🚨 Sesi Berakhir / Tidak Valid</h2>
    <p>Demi keamanan, silakan login ulang secara manual.</p>
    <br>
    <a href="admin-login.html" class="btn btn-approve" style="text-decoration: none; padding: 10px 20px;">Ke Halaman
      Login</a>
  </div>

  <!-- CONTENT UTAMA -->
  <div id="mainContent" class="container" style="display: none;">
    <div class="header">
      <a href="admin-dashboard.html" class="btn-back">← Kembali ke Dashboard</a>
      <h1>Konfirmasi Peminjaman</h1>
    </div>

    <!-- PENDING SECTION -->
    <h3 style="color: #d63384;">📌 Request Pending</h3>
    <div class="table-responsive">
      <table id="tablePending">
        <thead>
          <tr>
            <th>ID</th>
            <th>Peminjam</th>
            <th>Buku</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tbodyPending">
          <tr>
            <td colspan="5" class="loading">Memuat data...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- BORROWED SECTION -->
    <h3 style="color: #d63384; margin-top: 40px;">📚 Sedang Dipinjam</h3>
    <div class="table-responsive">
      <table id="tableBorrowed">
        <thead>
          <tr>
            <th>ID</th>
            <th>Peminjam</th>
            <th>Buku</th>
            <th>Tgl Pinjam</th>
            <th>Jatuh Tempo</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tbodyBorrowed">
          <tr>
            <td colspan="6" class="loading">Memuat data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    /* --- LOGIC AMAN (NO AUTO-REDIRECT) --- */
    const API_BASE = "http://127.0.0.1:8000/api";
    const token = localStorage.getItem("adminToken");

    // 1. Cek Token di Awal (Manual Mode)
    if (!token) {
      showAuthError();
    } else {
      // Tampilkan konten utama jika ada token
      document.getElementById("mainContent").style.display = "block";
      initApp();
    }

    function showAuthError() {
      document.getElementById("mainContent").style.display = "none";
      document.getElementById("authError").style.display = "block";
      // Hapus token biar bersih
      localStorage.removeItem("adminToken");
      localStorage.removeItem("adminUser");
    }

    function getHeaders() {
      return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      };
    }

    /* --- DATA LOADING --- */
    async function initApp() {
      await loadPending();
      await loadBorrowed();
    }

    async function loadPending() {
      try {
        const res = await fetch(`${API_BASE}/admin/transactions/pending-borrow`, { headers: getHeaders() });
        if (res.status === 401 || res.status === 403) { showAuthError(); return; }

        const data = await res.json();
        renderPending(Array.isArray(data) ? data : data.data);
      } catch (err) {
        console.error(err);
        document.getElementById("tbodyPending").innerHTML = `<tr><td colspan="5" style="color:red;text-align:center">Gagal memuat data (Cek Console)</td></tr>`;
      }
    }

    async function loadBorrowed() {
      try {
        const res = await fetch(`${API_BASE}/admin/transactions/borrowed`, { headers: getHeaders() });
        if (res.status === 401 || res.status === 403) { showAuthError(); return; }

        const data = await res.json();
        renderBorrowed(Array.isArray(data) ? data : data.data);
      } catch (err) {
        console.error(err);
        document.getElementById("tbodyBorrowed").innerHTML = `<tr><td colspan="6" style="color:red;text-align:center">Gagal memuat data</td></tr>`;
      }
    }

    /* --- RENDERING --- */
    function renderPending(list) {
      const tbody = document.getElementById("tbodyPending");
      if (!list || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center">Tidak ada request pending.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(trx => `
        <tr id="row-${trx.id}">
          <td>#${trx.id}</td>
          <td>
            <strong>${safe(trx.user?.full_name || trx.user?.name)}</strong><br>
            <small style="color:#666">${safe(trx.user?.email)}</small>
          </td>
          <td>
            <strong>${safe(trx.book?.title)}</strong><br>
            <small>Stok Fisik: ${trx.book?.stock ?? 0}</small>
          </td>
          <td><span class="badge bg-pending">${trx.status}</span></td>
          <td>
            <div class="btn-group">
              <button class="btn btn-reject" onclick="doReject(${trx.id})">Tolak</button>
              <button class="btn btn-approve" onclick="doApprove(${trx.id})">Approve</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    function renderBorrowed(list) {
      const tbody = document.getElementById("tbodyBorrowed");
      if (!list || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center">Belum ada buku dipinjam.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(trx => `
        <tr>
          <td>#${trx.id}</td>
          <td>${safe(trx.user?.full_name || trx.user?.name)}</td>
          <td>${safe(trx.book?.title)}</td>
          <td>${formatDate(trx.borrow_date)}</td>
          <td>${formatDate(trx.due_date)}</td>
          <td><span class="badge bg-borrowed">${trx.status}</span></td>
        </tr>
      `).join("");
    }

    /* --- ACTIONS --- */
    function doApprove(id) {
      Swal.fire({
        title: 'Setujui Peminjaman?',
        text: "Stok buku akan berkurang 1.",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#198754',
        confirmButtonText: 'Ya, Approve!',
        cancelButtonText: 'Batal'
      }).then((result) => {
        if (result.isConfirmed) {
          sendAction(id, 'approve');
        }
      });
    }

    function doReject(id) {
      Swal.fire({
        title: 'Tolak Peminjaman',
        input: 'text',
        inputLabel: 'Alasan Penolakan',
        inputPlaceholder: 'Contoh: Stok habis, Buku rusak...',
        showCancelButton: true,
        confirmButtonColor: '#dc3545',
        confirmButtonText: 'Tolak',
        inputValidator: (value) => {
          if (!value) {
            return 'Alasan wajib diisi!'
          }
        }
      }).then((result) => {
        if (result.isConfirmed) {
          sendAction(id, 'reject', { reason: result.value });
        }
      });
    }

    async function sendAction(id, action, body = {}) {
      const url = `${API_BASE}/admin/transactions/${id}/${action}`;

      try {
        const res = await fetch(url, {
          method: 'PUT',
          headers: getHeaders(),
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (res.ok) {
          Swal.fire('Berhasil!', data.message, 'success');
          // Hapus baris dari tabel tanpa reload page penuh
          document.getElementById(`row-${id}`)?.remove();
          // Refresh tabel borrowed kalau approve
          if (action === 'approve') loadBorrowed();
        } else {
          Swal.fire('Gagal!', data.message || 'Terjadi kesalahan backend.', 'error');
        }
      } catch (error) {
        Swal.fire('Error!', 'Tidak dapat menghubungi server.', 'error');
      }
    }

    /* --- HELPERS --- */
    function safe(str) {
      return str ? str.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "-";
    }

    function formatDate(dateStr) {
      if (!dateStr) return "-";
      return dateStr.split("T")[0]; // Ambil YYYY-MM-DD saja
    }

  </script>
</body>

</html>
