<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Denda - Member</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      font-family: 'Outfit', sans-serif !important;
      background: linear-gradient(135deg, #ffd1e8 0%, #c2e5ff 100%) !important;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 50px;
    }

    .main-container {
      width: 100%;
      max-width: 1100px;
      padding: 0 20px 40px;
    }

    .glass-box {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      padding: 35px;
      width: 100%;
    }

    .page-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 800;
      color: #ff6fae;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .page-subtitle {
      color: #64748b;
      font-size: 15px;
      margin-top: 8px;
    }

    /* Modern Table Style */
    .table-container {
      overflow-x: auto;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.3);
    }

    .modern-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    .modern-table th {
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.6);
      color: #ff6fae;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid rgba(255, 111, 174, 0.2);
    }

    .modern-table td {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      font-size: 15px;
      color: #1e293b;
      vertical-align: middle;
    }

    .modern-table tbody tr {
      transition: all 0.2s ease;
    }

    .modern-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .highlight-row {
      background: rgba(255, 243, 205, 0.8) !important;
      border-left: 5px solid #ffc107;
    }

    /* Badges */
    .badge {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
    }

    .badge-paid {
      background: #dcfce7;
      color: #166534;
    }

    .badge-unpaid {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .fine-amount {
      font-weight: 800;
      color: #ef4444;
      font-size: 16px;
    }

    /* Action Buttons */
    .btn-pay {
      background: #ef4444;
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
    }

    .btn-pay:hover:not(:disabled) {
      background: #dc2626;
      transform: translateY(-2px);
    }

    .btn-disabled {
      background: #94a3b8;
      color: white;
      cursor: not-allowed;
      box-shadow: none;
    }

    .action-row {
      margin-top: 30px;
      display: flex;
      justify-content: center;
    }

    .btn-back-custom {
      background: white;
      color: #ff6fae;
      border: 2px solid #ff6fae;
      padding: 12px 30px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .btn-back-custom:hover {
      background: #ff6fae;
      color: white;
    }

    /* Profile UI hidden to match simple clean look, or kept if needed. Let's keep a minimal topbar. */
    .mini-topbar {
      position: absolute;
      top: 20px;
      right: 40px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .user-pill {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>

<body>
  <div class="mini-topbar">
    <div class="user-pill" id="userEmailTag">loading...</div>
  </div>

  <div class="main-container">
    <div class="glass-box">
      <div class="page-header">
        <h2 class="page-title">Denda Peminjaman</h2>
        <p class="page-subtitle">Selesaikan kewajiban denda untuk dapat meminjam buku kembali</p>
      </div>

      <div class="table-container">
        <table class="modern-table">
          <thead>
            <tr>
              <th>Judul Buku</th>
              <th>Pinjam</th>
              <th>Tenggat</th>
              <th>Total Denda</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="finesBody">
            <tr>
              <td colspan="6" style="padding: 40px; color: #64748b;">Mengecek data denda...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="action-row">
        <a href="dashboard.html" class="btn-back-custom">
          <span>←</span> Kembali ke Dashboard
        </a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000/api";
    const token = localStorage.getItem('token');
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));

    if (!token || !currentUser) window.location.href = 'login.html';
    document.getElementById('userEmailTag').innerText = currentUser.email;

    let prevFineStates = {};
    let notifiedIds = new Set();

    function formatCurrency(v) { return 'Rp ' + Number(v).toLocaleString('id-ID'); }
    function fmtDate(d) {
      return d ? new Date(d).toLocaleString('id-ID', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      }) : '-';
    }

    async function loadFines() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const highlightId = urlParams.get('highlight');

        const res = await fetch(API_URL + '/transactions/fines', {
          headers: { 'Accept': 'application/json', 'Authorization': 'Bearer ' + token }
        });
        const json = await res.json();

        // Find array in response
        let data = Array.isArray(json) ? json : (json.data || []);
        if (!Array.isArray(data)) {
          // exhaustive search for array if nested
          for (let k in json) if (Array.isArray(json[k])) { data = json[k]; break; }
        }

        const body = document.getElementById('finesBody');
        if (data.length === 0) {
          body.innerHTML = '<tr><td colspan="6" style="padding: 60px; color: #64748b;">Hebat! Anda tidak memiliki denda tertunggak 🎉</td></tr>';
          return;
        }

        body.innerHTML = data.map(trx => {
          const isHighlighted = highlightId && trx.id == highlightId;
          const paid = !!trx.fine_paid_at;
          const requested = !!trx.fine_payment_requested_at;

          // Calculate estimate (Rp 1000/day) with hourly precision
          let estimatedFine = 0;
          if (trx.due_date && !paid) {
            const due = new Date(trx.due_date);
            const now = new Date();
            if (now > due) {
              const hoursLate = (now - due) / (1000 * 60 * 60);
              const daysLate = Math.ceil(hoursLate / 24);
              estimatedFine = Math.max(daysLate, 1) * 1000;
            }
          }
          // PERSIST NOMINAL: Tampilkan fine_amount asli meskipun sudah dibayar (Paid)
          const actualFine = trx.fine_amount || estimatedFine;

          let statusBadge = '';
          if (requested) {
            statusBadge = '<span class="badge badge-pending">Verifikasi Denda</span>';
          } else {
            statusBadge = '<span class="badge badge-unpaid">Belum Dibayar</span>';
          }

          let actionBtn = '-';
          if (!paid) {
            if (requested) actionBtn = '<button class="btn-pay btn-disabled" disabled>Permintaan Terkirim</button>';
            else actionBtn = `<button class="btn-pay" onclick="payFineConfirm(${trx.id}, ${actualFine})">💰 Bayar</button>`;
          }

          // Initial state for tracker
          prevFineStates[trx.id] = paid;

          return `<tr id="row-${trx.id}" class="${isHighlighted ? 'highlight-row' : ''}">
            <td style="font-weight:600;">${trx.book?.title || '-'}</td>
            <td>${fmtDate(trx.borrow_date)}</td>
            <td>${fmtDate(trx.due_date)}</td>
            <td><span class="fine-amount">${formatCurrency(actualFine)}</span></td>
            <td>${statusBadge}</td>
            <td>${actionBtn}</td>
          </tr>`;
        }).join('');

        if (highlightId) {
          setTimeout(() => {
            const el = document.getElementById('row-' + highlightId);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 500);
        }
      } catch (e) {
        console.error(e);
        document.getElementById('finesBody').innerHTML = '<tr><td colspan="6" style="padding:40px; color:#ef4444;">Gagal menghubungi server.</td></tr>';
      }
    }

    async function payFineConfirm(id, amount) {
      const result = await Swal.fire({
        title: 'Konfirmasi Pembayaran',
        html: `<p>Anda akan melakukan konfirmasi pembayaran sebesar:</p><h2 style="color:#ef4444">${formatCurrency(amount)}</h2><p style="font-size:13px; color:#64748b; margin-top:10px;">Pastikan Anda telah melakukan transfer ke rekening perpustakaan.</p>`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'Ya, Sudah Bayar',
        cancelButtonText: 'Batal'
      });

      if (result.isConfirmed) {
        try {
          const res = await fetch(API_URL + '/transactions/' + id + '/pay-fine', {
            method: 'POST', headers: { 'Accept': 'application/json', 'Authorization': 'Bearer ' + token }
          });
          const j = await res.json();
          if (res.ok) {
            Swal.fire({ icon: 'success', title: 'Terkirim!', text: 'Permintaan verifikasi pembayaran telah dikirim ke admin.', timer: 2000, showConfirmButton: false });
            loadFines();
          } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: j.message || 'Error' });
          }
        } catch (e) {
          Swal.fire({ icon: 'error', title: 'Error', text: 'Koneksi terputus.' });
        }
      }
    }

    async function pollApprovals() {
      try {
        const res = await fetch(API_URL + '/transactions/fines', { headers: { 'Accept': 'application/json', 'Authorization': 'Bearer ' + token } });
        if (!res.ok) return;
        const json = await res.json();
        let list = Array.isArray(json) ? json : (json.data || []);
        list.forEach(trx => {
          const wasPaid = !!prevFineStates[trx.id];
          const isPaid = !!trx.fine_paid_at;
          if (!wasPaid && isPaid && !notifiedIds.has(trx.id)) {
            Swal.fire({ icon: 'success', title: 'Pembayaran Diterima! ✅', text: `Pembayaran untuk buku "${trx.book?.title}" telah disetujui admin.` });
            notifiedIds.add(trx.id);
            loadFines();
          }
          prevFineStates[trx.id] = isPaid;
        });
      } catch (e) { }
    }

    setInterval(pollApprovals, 10000);
    loadFines();
  </script>
</body>

</html>
