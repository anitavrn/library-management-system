<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Form Peminjaman</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <div class="borrow-page">
    <div class="borrow-card">

      <h2 class="borrow-title">Form Peminjaman</h2>

      <form id="borrowForm">

        <label>Judul Buku</label>
        <input type="text" id="bookTitle" readonly>

        <label>Tanggal & Jam Pinjam</label>
        <input type="datetime-local" id="borrowDate" required>

        <label>Tenggat Pengembalian</label>
        <input type="datetime-local" id="returnDate" required>

        <div class="action-row">
          <button type="button" class="btn-back" onclick="history.back()">← Batal</button>
          <button type="submit" class="btn-borrow">📚 Submit</button>
        </div>

      </form>

    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000/api";
    const MEMBER_TOKEN_KEY = "token";

    /* ===============================
       AUTH CHECK
    ================================ */
    const token = localStorage.getItem(MEMBER_TOKEN_KEY);
    if (!token) {
      window.location.href = "login.html";
    }

    /* ===============================
       AMBIL DATA BUKU
    ================================ */
    const bookData = JSON.parse(localStorage.getItem("borrowBook"));
    if (!bookData || !bookData.api_book_id || !bookData.title) {
      Swal.fire({
        icon: "error",
        title: "Data tidak ditemukan",
        text: "Silakan pilih buku terlebih dahulu."
      }).then(() => {
        window.location.href = "books.html";
      });
    }

    document.getElementById("bookTitle").value = bookData.title;

    // Set default borrow date to now (local)
    function setNow() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      const nowStr = now.toISOString().slice(0, 16);
      document.getElementById("borrowDate").value = nowStr;

      // Default return date is 7 days from now
      const due = new Date();
      due.setDate(due.getDate() + 7);
      due.setMinutes(due.getMinutes() - due.getTimezoneOffset());
      document.getElementById("returnDate").value = due.toISOString().slice(0, 16);
    }
    setNow();

    // SMART SYNC: If borrow date/time changes, shift return date to match the time & keep 7 day gap
    document.getElementById("borrowDate").addEventListener("change", function (e) {
      const newBorrow = new Date(this.value);
      if (isNaN(newBorrow)) return;

      const newDue = new Date(newBorrow);
      newDue.setDate(newDue.getDate() + 7);

      // Handle timezone for toISOString
      newDue.setMinutes(newDue.getMinutes() - newDue.getTimezoneOffset());
      document.getElementById("returnDate").value = newDue.toISOString().slice(0, 16);
    });

    /* ===============================
       SUBMIT PEMINJAMAN
    ================================ */
    document.getElementById("borrowForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const borrowDate = document.getElementById("borrowDate").value;
      const returnDate = document.getElementById("returnDate").value;

      if (!borrowDate || !returnDate) {
        Swal.fire("Form belum lengkap", "Tanggal pinjam dan kembali wajib diisi.", "warning");
        return;
      }

      if (returnDate < borrowDate) {
        Swal.fire("Tanggal tidak valid", "Tanggal kembali tidak boleh sebelum tanggal pinjam.", "error");
        return;
      }

      fetch(`${API_URL}/transactions`, {
        method: "POST",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          api_book_id: bookData.api_book_id,
          title: bookData.title,
          author: bookData.author || null,
          borrow_date: borrowDate,
          due_date: returnDate
        })
      })
        .then(async res => {
          const data = await res.json();
          return { status: res.status, data };
        })
        .then(({ status, data }) => {
          if (status === 201) {
            localStorage.removeItem("borrowBook");

            let swalConfig = {
              icon: "success",
              title: "Permintaan Berhasil",
              text: data.message,
              confirmButtonText: "Selesai"
            };

            // Custom UI for auto-approve vs pending
            if (data.status_type === 'auto_approved') {
              swalConfig.title = "Peminjaman Berhasil! 📖";
              delete swalConfig.text; // Remove sub-text for cleaner look
            } else if (data.status_type === 'pending_request') {
              swalConfig.icon = "info";
              swalConfig.title = "Request Terkirim 📩";
              swalConfig.text = "Buku ini belum ada di koleksi. Request Anda sedang diproses admin.";
            }

            Swal.fire(swalConfig).then(() => {
              window.location.href = "dashboard.html";
            });

          } else if (status === 400 && data.status_type === 'out_of_stock') {
            // SCENARIO: STOCK EMPTY (SweetAlert requested by user)
            Swal.fire({
              icon: "warning",
              title: "Stok Habis! ⚠️",
              text: data.message || "Maaf, saat ini buku tersebut sedang tidak tersedia.",
              confirmButtonText: "Cari Buku Lain"
            }).then(() => {
              window.location.href = "books.html";
            });
          } else {
            Swal.fire(
              "Gagal Meminjam",
              data.message || "Terjadi kesalahan pada sistem.",
              "error"
            );
          }
        })
        .catch(() => {
          Swal.fire("Server Error", "Tidak bisa terhubung ke backend.", "error");
        });
    });
  </script>

</body>

</html>
