<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Member</title>
  <link rel="stylesheet" href="css/style.css?v=2.0">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* Force visibility for debugging */
    #loginForm {
      display: block !important;
    }

    .login-wrapper {
      display: flex !important;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd1e8 0%, #c2e5ff 100%);
    }
  </style>
</head>

<body>

  <div class="login-wrapper">
    <div class="login-card" id="loginForm">
      <h2 style="color: #ff6fae; margin-bottom: 20px; text-align: center;">Login Member</h2>

      <div style="margin-bottom: 15px;">
        <input type="email" id="email" placeholder="Email"
          style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
      </div>

      <div style="margin-bottom: 20px;">
        <input type="password" id="password" placeholder="Password"
          style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
      </div>

      <button type="button" onclick="login()"
        style="width: 100%; padding: 12px; background: #ff6fae; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold;">
        Masuk Dashboard
      </button>

      <p style="text-align: center; margin-top: 20px; font-size: 14px;">
        Belum punya akun? <a href="register.html"
          style="color: #ff6fae; text-decoration: none; font-weight: bold;">Daftar di sini</a>
      </p>

      <div style="text-align: center; margin-top: 10px;">
        <a href="admin-login.html" style="font-size: 12px; color: #888;">Login sebagai Admin</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000/api";

    // AUTO-REDIRECT DIMATIKAN untuk mencegah flickering loop
    console.log("Login page initialized. Auto-redirect is OFF.");

    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        Swal.fire("Peringatan", "Email dan Password harus diisi!", "warning");
        return;
      }

      fetch(`${API_URL}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ email, password })
      })
        .then(async res => {
          const data = await res.json();
          if (res.ok) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("currentUser", JSON.stringify(data.user));
            Swal.fire("Berhasil", "Selamat datang!", "success").then(() => {
              window.location.href = "dashboard.html";
            });
          } else {
            Swal.fire("Gagal", data.message || "Email/Password salah", "error");
          }
        })
        .catch(err => {
          Swal.fire("Error", "Gagal terhubung ke server", "error");
        });
    }
  </script>
</body>

</html>
